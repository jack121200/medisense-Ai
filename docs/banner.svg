<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="MediSense AI — healthcare that listens, in your own language">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051F20"/>
      <stop offset="0.55" stop-color="#0B2B26"/>
      <stop offset="1" stop-color="#163832"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8EB69B" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8EB69B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DAF1DE" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DAF1DE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DAF1DE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#DAF1DE"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-60%" width="110%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- two heartbeats: P wave, QRS complex, T wave -->
    <path d="M0 310 H780 l16 0 l10 -12 l10 12 l18 0 l8 16 l14 -150 l16 176 l10 -42 l20 0 l24 -26 l26 26 H1090 l16 0 l10 -12 l10 12 l18 0 l8 16 l14 -150 l16 176 l10 -42 l20 0 l24 -26 l26 26 H1280"
          fill="none" stroke="#8EB69B" stroke-width="12" stroke-opacity="0.45" filter="url(#soft)"/>
    <path d="M0 310 H780 l16 0 l10 -12 l10 12 l18 0 l8 16 l14 -150 l16 176 l10 -42 l20 0 l24 -26 l26 26 H1090 l16 0 l10 -12 l10 12 l18 0 l8 16 l14 -150 l16 176 l10 -42 l20 0 l24 -26 l26 26 H1280"
          fill="none" stroke="url(#trace)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="80" y="48" width="338" height="34" rx="17" fill="#DAF1DE" fill-opacity="0.06" stroke="#8EB69B" stroke-opacity="0.45"/>
    <circle cx="101" cy="65" r="4.5" fill="#8EB69B"/>
    <text x="116" y="70.5" font-size="13.5" font-weight="700" letter-spacing="2.4" fill="#DAF1DE">AI-ASSISTED HEALTHCARE PLATFORM</text>

    <text x="76" y="156" font-size="76" font-weight="800" letter-spacing="-2" fill="#DAF1DE">MediSense <tspan fill="#8EB69B">AI</tspan></text>
    <text x="80" y="200" font-size="26" fill="#DAF1DE" fill-opacity="0.82">Healthcare that listens — in your own language.</text>

    <g font-size="15.5" font-weight="600" fill="#DAF1DE">
      <rect x="80"  y="224" width="190" height="36" rx="10" fill="#235347" fill-opacity="0.75"/>
      <text x="175" y="247.5" text-anchor="middle">Hindi voice assistant</text>
      <rect x="282" y="224" width="186" height="36" rx="10" fill="#235347" fill-opacity="0.75"/>
      <text x="375" y="247.5" text-anchor="middle">5 trained ML models</text>
      <rect x="480" y="224" width="158" height="36" rx="10" fill="#235347" fill-opacity="0.75"/>
      <text x="559" y="247.5" text-anchor="middle">5 clinical roles</text>
      <rect x="650" y="224" width="170" height="36" rx="10" fill="#235347" fill-opacity="0.75"/>
      <text x="735" y="247.5" text-anchor="middle">3 safety layers</text>
    </g>
  </g>
</svg>
