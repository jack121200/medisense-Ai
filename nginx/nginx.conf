worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    upstream backend {
        server backend:5000;
    }

    upstream frontend {
        server frontend:8080;
    }

    # Basic request-rate limiting at the edge — previously absent entirely,
    # so /api/ (including login) had no protection here at all beyond
    # whatever the backend's own express-rate-limit does.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        server_name localhost;

        # Security headers — previously none were set anywhere in this
        # config. HSTS is commented out here since it requires HTTPS to be
        # actually configured first (see the TLS note below) — enabling
        # HSTS over a plaintext-only origin just tells browsers to distrust
        # a scheme this server doesn't yet serve.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # TLS: this server currently only listens on :80. To add HTTPS,
        # mount a certificate (e.g. via certbot or a mounted cert volume)
        # and add:
        #   listen 443 ssl;
        #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
        #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # then redirect :80 to :443 with `return 301 https://$host$request_uri;`

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Backend API
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Socket.IO WebSocket
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
        
        # Swagger docs
        location /api/docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }
}
