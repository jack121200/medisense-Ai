# Kafka, Zookeeper, Elasticsearch, and MinIO were removed from this stack —
# none of them had any actual client library usage anywhere in backend/ or
# ml-service/ (confirmed by grep before removing), so they were pure
# unused infrastructure. Elasticsearch was additionally running with
# xpack.security.enabled=false on a host-exposed port. If a real need for
# search, object storage, or event streaming comes up later, add the
# service back deliberately alongside the code that actually uses it.
services:
  # ──────────────────────────────────────────
  # NGINX — Reverse Proxy
  # ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - medisense-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ──────────────────────────────────────────
  # FRONTEND — React + Vite
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_WS_URL=http://localhost:5000
      - VITE_VAPI_PUBLIC_KEY=${VAPI_PUBLIC_KEY}
    depends_on:
      - backend
    networks:
      - medisense-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ──────────────────────────────────────────
  # BACKEND — Node.js + Express
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://medisense:${POSTGRES_PASSWORD}@postgres:5432/medisense_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_INTERNAL_KEY=${ML_SERVICE_INTERNAL_KEY}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=http://localhost
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_PUBLIC_KEY=${VAPI_PUBLIC_KEY}
      - VAPI_WEBHOOK_SECRET=${VAPI_WEBHOOK_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - medisense-net
    restart: unless-stopped
    volumes:
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ──────────────────────────────────────────
  # ML SERVICE — Python FastAPI
  # ──────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    # No host port binding — ml-service is internal-only. It previously
    # published 8000:8000 directly, which let anyone who could reach the
    # host bypass the backend's JWT auth entirely and call every
    # prediction/upload endpoint. The backend reaches it at
    # http://ml-service:8000 over the internal Docker network only.
    environment:
      - DATABASE_URL=postgresql://medisense:${POSTGRES_PASSWORD}@postgres:5432/medisense_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MODEL_PATH=/app/models
      - HEART_CSV=/app/data/HeartDiseaseTrain-Test.csv
      - INTERNAL_API_KEY=${ML_SERVICE_INTERNAL_KEY}
      - ALLOWED_ORIGIN=http://backend:5000
    volumes:
      - ./ml-service/app/models:/app/models
      - ./HeartDiseaseTrain-Test.csv:/app/data/HeartDiseaseTrain-Test.csv:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medisense-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  # ──────────────────────────────────────────
  # POSTGRESQL + TIMESCALEDB
  # ──────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    # No host port binding — every consumer (backend, ml-service) reaches
    # Postgres over the internal Docker network. Uncomment if you need
    # direct access from the host (e.g. a local GUI client / psql).
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_DB=medisense_db
      - POSTGRES_USER=medisense
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisense -d medisense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medisense-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ──────────────────────────────────────────
  # REDIS
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    # No host port binding — only accessible internally via Docker network
    # (backend and ml-service connect via redis://redis:6379 internally)
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medisense-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  medisense-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
